plugins {
    id 'com.android.application'
}

def beta = project.hasProperty('re4Beta')
// -Pre4BetaTrack=test (with -Pre4Beta): a closed test for a few people, beside the Beta. Its own
// package (com.shiinobu.re4.beta.test), name ("RE4 Test"), folder (/sdcard/RE4Wii-Test) and switch
// (beta-channel-test.json), so it never installs over the Beta or touches its saves and settings.
// It runs only while that file is online and open: no file, "enabled": false or no network = locked.
def betaTrack = (project.findProperty('re4BetaTrack') ?: '').toString().toLowerCase()
if (betaTrack && !(betaTrack ==~ /[a-z][a-z0-9]*/)) throw new GradleException('re4BetaTrack: letters and digits only')
if (betaTrack && !beta) throw new GradleException('re4BetaTrack needs -Pre4Beta')
def betaTrackName = betaTrack ? betaTrack.capitalize() : ''

android {
    namespace 'com.shiinobu.re4'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.shiinobu.re4'
        // Guest RAM uses memfd_create, which bionic has from Android 11 (API 30).
        minSdk 29
        targetSdk 34
        // -Pre4VersionCode / -Pre4VersionName: a newer build for testing the updater.
        versionCode((project.findProperty('re4VersionCode') ?: '18') as int)
        versionName(project.findProperty('re4VersionName') ?: '0.0.1')
        // -Pre4Beta: the testers' Beta. Its own package (it installs next to the release), it
        // updates itself from the GitHub pre-releases "v<version>-beta.<N>" (Updater.latestBeta) and
        // locks itself once the Beta is switched off or 1.0.0 is out (BetaGate).
        // -Pre4BetaNumber=N: the Beta's number, one up for every Beta released; it is the
        // versionCode, so Android installs each Beta over the one before.
        if (beta) {
            applicationIdSuffix(betaTrack ? '.beta.' + betaTrack : '.beta')
            versionCode((project.findProperty('re4BetaNumber') ?: '1') as int)
        }
        buildConfigField 'boolean', 'BETA', beta.toString()
        buildConfigField 'String', 'BETA_TRACK', '"' + betaTrackName + '"'
        // -Pre4BetaLabel="Final Beta": the name the Beta shows instead of "Beta <N>" (the number stays
        // the versionCode, so beta-channel.json's min_beta still works).
        def betaLabel = project.findProperty('re4BetaLabel') ?: ''
        buildConfigField 'String', 'BETA_LABEL', '"' + betaLabel.toString().replace('"', '') + '"'
        // Online updates: the release checks PotatoRecomp/RE4Wii-Android's latest GitHub release at start
        // (Updater; 404 while the repo is private or has no release = nothing to offer). Off in the Beta,
        // which was handed out by hand; its remote switch (BetaGate.BETA_STATUS,
        // github.com/shiinobu/re4-beta-android) works without it.
        buildConfigField 'boolean', 'ONLINE_UPDATES', (!beta).toString()
        // -Pre4Cheats=true|false: Settings > Cheats. On in the Beta and in a release unless asked off;
        // with it off the tab is hidden and the game always gets every cheat off.
        def cheats = project.findProperty('re4Cheats')
        // A bare -Pre4Cheats arrives as '' and means on; only an explicit 'false' turns it off.
        buildConfigField 'boolean', 'CHEATS', (cheats?.toString()?.toLowerCase() != 'false').toString()
        // -Pre4Dev=true: developer-only tools in the game's System tab (Stage Select). Off by default.
        buildConfigField 'boolean', 'DEV', (project.findProperty('re4Dev')?.toString() == 'true').toString()
        manifestPlaceholders = [appLabel: betaTrack ? 'RE4 ' + betaTrackName : (beta ? 'RE4 Beta' : '@string/app_name')]
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Personal builds: sign with the local debug key so the APK installs directly.
            signingConfig signingConfigs.debug
        }
    }

    lint {
        // Release builds skip lint's vital checks: this machine builds offline, without lint's jars.
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // libmain.so and the runtime's data files are staged by tools/b-android.ps1 -Mode stage from
            // the native build (generated/android-build); they are not checked in.
            jniLibs.srcDirs = ['../generated/android-native/jniLibs']
            assets.srcDirs = ['../generated/android-native/assets', 'src/main/assets']
        }
    }

    androidResources {
        // assets/native/libmain.so.zst (NativeLib) is already compressed; stored as is, it opens as an fd.
        noCompress += ['zst']
    }

    packagingOptions {
        jniLibs {
            // The other .so files compressed in the APK; Android extracts them once at install.
            // libmain.so itself is not a jniLib: it ships zstd-packed in assets (NativeLib).
            useLegacyPackaging true
        }
    }
}
